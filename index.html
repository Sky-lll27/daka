<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备考中心</title>
<style>
  :root{
    --red:#c0392b; --bg:#f5f3f0; --card:#fff; --ink:#2c2c2c;
    --muted:#8a8a8a; --line:#e8e4df; --blue:#1565c0; --green:#2e7d32;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; padding:24px 16px 40px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:20px;font-weight:800;letter-spacing:.5px;}
  .sub{font-size:13px;color:var(--muted);margin-top:6px;margin-bottom:22px;}
  .group-title{
    font-size:13px;font-weight:700;color:var(--muted);
    margin:22px 0 10px;padding-left:2px;letter-spacing:1px;
  }
  .group-title:first-of-type{margin-top:0;}
  a.item{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 18px;margin-bottom:10px;text-decoration:none;color:inherit;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  a.item:active{transform:scale(.985);}
  @media(hover:hover){
    a.item:hover{border-color:var(--red);box-shadow:0 4px 14px rgba(0,0,0,.07);}
  }
  .ico{
    width:42px;height:42px;border-radius:11px;flex:0 0 42px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#fff;
  }
  .ico.a{background:linear-gradient(135deg,#c0392b,#e74c3c);}
  .ico.b{background:linear-gradient(135deg,#1565c0,#42a5f5);}
  .ico.c{background:linear-gradient(135deg,#2e7d32,#66bb6a);}
  .ico.d{background:linear-gradient(135deg,#6a1b9a,#ab47bc);}
  .txt{flex:1;min-width:0;}
  .name{font-size:16px;font-weight:700;}
  .desc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .arrow{color:#ccc;font-size:18px;flex:0 0 auto;}
  .tip{
    margin-top:26px;font-size:12px;color:var(--muted);
    line-height:1.8;text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>备考中心</h1>
  <div class="sub">2027 国考 · 双线备考</div>

  <div class="group-title">打 卡</div>
  <a class="item" href="guokao-daka.html">
    <div class="ico a">考</div>
    <div class="txt">
      <div class="name">国考打卡</div>
      <div class="desc">45 天计划 · 倒计时 · 统计 · 支持云同步</div>
    </div>
    <div class="arrow">›</div>
  </a>
  <a class="item" href="meiri-daka.html">
    <div class="ico b">日</div>
    <div class="txt">
      <div class="name">每日打卡</div>
      <div class="desc">自定义任务 · 连续天数 · 支持云同步</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <div class="group-title">知 识 页</div>
  <a class="item" href="guanlianci.html">
    <div class="ico c">词</div>
    <div class="txt">
      <div class="name">关联词与逻辑关系词表</div>
      <div class="desc">行测言语理解 · 逻辑关系速查</div>
    </div>
    <div class="arrow">›</div>
  </a>
  <a class="item" href="tuxing-tuili.html">
    <div class="ico d">图</div>
    <div class="txt">
      <div class="name">图推五步骤与考点方法</div>
      <div class="desc">行测图形推理 · 解题步骤与考点</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <div class="tip">
    打卡页点右下角「设置」粘贴令牌即可开启云同步<br>
    知识页不需要同步，随时可看
  </div>
</div>
</body>
</html>
